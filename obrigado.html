<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compra aprovada — FOX MUSIC</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#090909;color:#fff;font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{width:min(520px,100%);background:#111;border:1px solid #2a2a2a;border-radius:22px;padding:42px 28px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.45)}
    .logo{font-weight:900;font-size:30px;letter-spacing:2px;margin-bottom:28px}
    .logo span{color:#ff7a00}
    .check{width:74px;height:74px;border-radius:50%;margin:0 auto 22px;background:#ff7a00;color:#111;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900}
    h1{font-size:28px;margin:0 0 12px}
    p{color:#bdbdbd;font-size:16px;line-height:1.55;margin:0 auto 28px;max-width:420px}
    .btn{display:block;text-decoration:none;background:#ff7a00;color:#111;font-weight:900;border-radius:12px;padding:16px 20px;font-size:16px}
    .note{margin-top:18px!important;font-size:13px!important;color:#777!important}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">FOX <span>MUSIC</span></div>
    <div class="check">✓</div>
    <h1>Compra aprovada!</h1>
    <p>Seu pagamento foi confirmado. Seu acesso ao FOX MUSIC Gift Hub será liberado conforme o produto adquirido.</p>
    <a class="btn" href="./">ACESSAR MEUS KITS</a>
    <p class="note">Use o mesmo e-mail informado na compra para acessar sua área.</p>
  </main>
</body>
</html>
